[project]
name = "ia-gate"
version = "0.1.0"
description = "MCP server that lets Claude install and test apps on Android devices addressed by a stable gate ID"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn",
]

[project.scripts]
ia-gate = "ia_gate.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_gate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
